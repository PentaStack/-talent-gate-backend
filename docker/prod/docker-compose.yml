services:
  api:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    ports:
      - "80:80"
    env_file:
      - ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    entrypoint: ["php", "artisan", "schedule:work"]
    env_file:
      - ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
