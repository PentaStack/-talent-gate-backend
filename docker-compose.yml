services:
    php-apache:
        build: .
        container_name: iti-php-apache
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
        command: >
            bash -c "
            chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache &&
            apache2-foreground"

    mysql:
        image: mysql:8.0
        container_name: iti-mysql
        restart: always
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app_db
            MYSQL_USER: app_user
            MYSQL_PASSWORD: app_pass
        volumes:
            - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: always
        ports:
            - "8081:80"
        depends_on:
            - mysql
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306

volumes:
    mysql_data:
